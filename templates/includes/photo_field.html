<div class="field-row photo-field">
  <label for="id_{{ name }}">{{ label }}</label>
  <input id="id_{{ name }}" type="file" name="{{ name }}" accept="image/*" data-photo="1">
  <p class="help">{% if help_text %}{{ help_text }} {% endif %}Foto dari kamera HP dikecilkan otomatis sebelum dikirim.</p>
</div>
