{% if photos %}<div class="photo-thumbs">{% for p in photos %}<a href="{% url 'core:attachment' p.pk %}?lihat=1" target="_blank" rel="noopener" title="Foto oleh {{ p.uploaded_by }} · {{ p.uploaded_at|date:'d/m H:i' }}"><img src="{% url 'core:attachment' p.pk %}?lihat=1" alt="Foto lampiran {{ forloop.counter }}" loading="lazy" width="72" height="72"></a>{% endfor %}</div>{% endif %}
