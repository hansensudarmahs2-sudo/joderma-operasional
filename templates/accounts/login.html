{% extends "base.html" %}
{% block title %}Masuk · JoDerma Staff Ops{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto">
  <h1>JoDerma Staff Ops</h1>
  <p class="sub">Aplikasi internal klinik. Gunakan akun pribadi Anda.</p>
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Nama pengguna</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus>
    <label for="id_password">Kata sandi</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <p></p>
    <button class="btn" type="submit" style="width:100%">Masuk</button>
  </form>
</div>
{% endblock %}
