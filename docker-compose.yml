services:
  app:
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8731}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: joderma-ops
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PORT: ${APP_PORT:-8731}
      # Di DALAM container, Gunicorn harus bind 0.0.0.0 — 127.0.0.1 hanya loopback
      # milik container itu sendiri sehingga docker-proxy tidak dapat meneruskan.
      # Keamanan tetap terjaga oleh port publishing "127.0.0.1:PORT:PORT" di bawah:
      # namespace jaringan container terisolasi, dan host hanya membuka loopback.
      APP_HOST: 0.0.0.0
    # PENTING: port hanya di-bind ke loopback host. Tailscale Serve yang
    # mengeksposnya sebagai HTTPS privat di dalam tailnet.
    # Jangan pernah menghapus prefiks "127.0.0.1:" — itu membuka aplikasi ke LAN.
    ports:
      - "127.0.0.1:${APP_PORT:-8731}:${APP_PORT:-8731}"
    volumes:
      - ./data:/app/data
      - ./private_media:/app/private_media
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-8731}/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8731}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: joderma-ops-backup
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/app/scripts/backup_loop.sh"]
    volumes:
      - ./data:/app/data
      - ./private_media:/app/private_media
      - ./backups:/app/backups
      - ./logs:/app/logs
    depends_on:
      - app
