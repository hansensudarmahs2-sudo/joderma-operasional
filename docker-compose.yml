services:
  app:
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8731}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: joderma-ops
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PORT: ${APP_PORT:-8731}
      # Di DALAM container, Gunicorn harus bind 0.0.0.0 — 127.0.0.1 hanya loopback
      # milik container itu sendiri sehingga docker-proxy tidak dapat meneruskan.
      # Keamanan tetap terjaga oleh port publishing "127.0.0.1:PORT:PORT" di bawah:
      # namespace jaringan container terisolasi, dan host hanya membuka loopback.
      APP_HOST: 0.0.0.0
    # PENTING: port hanya di-bind ke loopback host. Tailscale Serve yang
    # mengeksposnya sebagai HTTPS privat di dalam tailnet.
    # Jangan pernah menghapus prefiks "127.0.0.1:" — itu membuka aplikasi ke LAN.
    ports:
      - "127.0.0.1:${APP_PORT:-8731}:${APP_PORT:-8731}"
    volumes:
      - ./data:/app/data
      - ./private_media:/app/private_media
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-8731}/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8731}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: joderma-ops-backup
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/app/scripts/backup_loop.sh"]
    volumes:
      - ./data:/app/data
      - ./private_media:/app/private_media
      - ./backups:/app/backups
      - ./logs:/app/logs
    depends_on:
      - app
    # Container ini mewarisi healthcheck dari image aplikasi, yang memeriksa
    # endpoint HTTP. Backup tidak menjalankan server HTTP, sehingga pemeriksaan
    # itu selalu gagal dan container tampak unhealthy padahal backup berjalan
    # normal. Alarm palsu berbahaya: status unhealthy jadi terbiasa diabaikan.
    #
    # Sehat di sini berarti backup terbaru masih segar (< 48 jam), bukan sekadar
    # prosesnya hidup. Proses yang hidup tetapi gagal menulis arsip justru
    # kegagalan paling berbahaya karena tidak terlihat dari luar.
    # Memakai Python karena image slim tidak menyertakan pgrep maupun find.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import pathlib, sys, time
          arsip = sorted(pathlib.Path("/app/backups/daily").glob("joderma-ops-*"))
          if not arsip:
              sys.exit(0)  # belum pernah backup: bukan kegagalan
          umur = time.time() - max(a.stat().st_mtime for a in arsip)
          sys.exit(0 if umur < 48 * 3600 else 1)
      interval: 300s
      timeout: 10s
      start_period: 30s
      retries: 2
