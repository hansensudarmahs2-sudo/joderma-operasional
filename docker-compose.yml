services:
  app:
    build: .
    container_name: joderma-ops
    restart: unless-stopped
    env_file: .env
    # PENTING: port hanya di-bind ke loopback host. Tailscale Serve yang
    # mengeksposnya sebagai HTTPS privat di dalam tailnet. Jangan ubah ke "8000:8000".
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./private_media:/app/private_media
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build: .
    container_name: joderma-ops-backup
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/app/scripts/backup_loop.sh"]
    volumes:
      - ./data:/app/data
      - ./private_media:/app/private_media
      - ./backups:/app/backups
      - ./logs:/app/logs
    depends_on:
      - app
